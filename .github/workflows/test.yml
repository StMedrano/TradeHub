name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose from clean checkout
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet

      - name: Build production app image from clean checkout
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: docker compose build app

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build Radix frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Run backend tests
        run: pytest -q
