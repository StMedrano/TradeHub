name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ephemeral Compose environment
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > .env

      - name: Validate Docker Compose from clean checkout
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet

      - name: Build production app image from clean checkout
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: docker compose build app

      - name: Verify persistent Postgres and Robinhood state volumes survive recreation
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: |
          set -euo pipefail
          trap 'docker compose down --remove-orphans' EXIT

          docker compose up -d --wait db
          docker compose run --rm init-secrets

          docker compose exec -T db psql -U tradehub -d tradehub -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE ci_persistence_probe (value text PRIMARY KEY); INSERT INTO ci_persistence_probe VALUES ('survived-recreate');"

          docker compose run --rm --user 0:0 --entrypoint /bin/sh init-secrets -c \
            "printf '%s\n' 'robinhood-state-survived-recreate' > /data/ci-robinhood-state-probe && chown 10001:10001 /data/ci-robinhood-state-probe && chmod 600 /data/ci-robinhood-state-probe"

          docker compose down --remove-orphans
          docker compose up -d --wait db
          docker compose run --rm init-secrets

          test "$(docker compose exec -T db psql -U tradehub -d tradehub -Atqc "SELECT value FROM ci_persistence_probe;")" = "survived-recreate"
          test "$(docker compose run --rm --user 10001:10001 --entrypoint /bin/sh init-secrets -c 'cat /data/ci-robinhood-state-probe')" = "robinhood-state-survived-recreate"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build Radix frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Run backend tests
        run: pytest -q
